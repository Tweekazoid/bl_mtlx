[project]
name = "material_x"
version = "0.1.2"
description = "MaterialX import/export Blender add-on"
authors = [
    {name = "Michal Hons", email = "info@mehpixel.com"},
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "MaterialX>=1.39.5",
]

# these will not be included in build distributions
[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "bandit>=1.9.4",
    "pydoclint>=0.8.3",
]

# This repo ships a Blender add-on (the src/ folder), it is not a pip package.
# Tell PDM not to treat it as a distribution so it only manages the dev venv.
[tool.pdm]
distribution = false

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["pyproject.toml", "**/*.py", "*.py"]
exclude = [
    "_debug/**",
    "_bck/**",
    "*.tmp",
    "__pycache__/**",
    ".venv/**",
    "*.pyi",
    "src/mtlxutils/**",  # vendored third-party MaterialX utilities (own LICENSE)
]

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
select = ["F", "E", "W", "C90", "I", "N", "D", "UP", "S1", "S2", "S3", "S5", "BLE", "FBT",
    "B", "A", "C4", "COM", "DTZ", "T10", "FA", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20", "Q", "RSE", "RET", "SLF",
    "SLOT", "SIM", "TID",
    "TC001", "TC004", "TC005", "TC010",
    "INT", "ARG", "FIX", "ERA", "PL", "TRY", "FLY", "PERF", "RUF"
]
ignore = [
    "D105", # undocumented-magic-method
    "D107", # undocumented-public-init
    "E501", # line-too-long
    "PLC0415", # import-outside-top-level
    "PLR2004",
    "PLR0913",
    "PLR0911",
    "RET504", # unnecessary-assign
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Blender add-on conventions require UPPER_SNAKE_CASE class names (e.g. BL_OBJECTOR_OT_*),
# mutable-set bl_options class attributes, and large operator execute() bodies that the
# Blender API contract makes hard to split. Suppress the rules that fight those patterns.
"src/**.py" = [
    "N801",     # Blender requires UPPER_SNAKE_CASE class names for operators/panels/menus
    "RUF012",   # bl_options = {"REGISTER"} is the documented Blender pattern
    "PLR0915",  # async timer operator bodies are intentionally inlined
    "PERF203",  # try/except inside module-probe loop is intentional
    "TRY300",   # return-in-try inside module-probe loop is clearer than else-block
    "TRY301",   # inline raise inside operator timer is fine
    "PLC0415",  # `requests` is imported lazily so non-Blender environments don't fail
]
".scripts/**.py" = ["N999"]  # dotted directory name is intentional
".tests/**.py" = ["N999", "D", "S", "T20", "INP", "PLR", "BLE", "ARG", "DTZ"]  # test scripts: prints/asserts/no-docstrings allowed

[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
ignore-private-args = true
ignore-underscore-args = true
exclude = "\\.venv|\\.ruff_cache|build|__pycache__|\\.vscode|\\.git|\\.github|tests|_debug|_bck|.*\\.tmp|.*\\.pyi"



[tool.bumpversion]
current_version = "0.1.2"
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -dev(?P<dev>\\d+)
    )?
"""
serialize = [
    "{major}.{minor}.{patch}-dev{dev}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = false
sign_tags = false
tag_name = "material_x-v{new_version}"
tag_message = "Bump version: {current_version} -> {new_version}"
allow_dirty = true
commit = false
message = "Bump version: {current_version} -> {new_version}"
commit_args = ""

[tool.bumpversion.part.dev]
optional_value = ""
values = "0123456789"
independent = true

[[tool.bumpversion.files]]
filename = "src/VERSION"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/blender_manifest.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
