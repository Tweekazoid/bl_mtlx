name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Release only on manual dispatch, or when a push to main has "RELEASE" in the
    # commit message. The "Bump version" guard stops the auto-bump commit looping.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (contains(github.event.head_commit.message, 'RELEASE') &&
           !contains(github.event.head_commit.message, 'Bump version')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bump-my-version
        run: pip install bump-my-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        run: |
          bump-my-version bump "${{ github.event.inputs.bump || 'patch' }}" \
            --commit --tag \
            --message "Bump version: {current_version} -> {new_version} [skip ci]"
          NEW_VERSION="$(tr -d '[:space:]' < src/VERSION)"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Build extension zip
        id: zip
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          ZIP="material_x-v${VERSION}.zip"
          (cd src && zip -r "../${ZIP}" . -x '*/__pycache__/*' '__pycache__/*' '*.pyc' '*.pyo')
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: material_x-v${{ steps.bump.outputs.new_version }}
          name: MaterialX v${{ steps.bump.outputs.new_version }}
          files: ${{ steps.zip.outputs.zip }}
          generate_release_notes: true
